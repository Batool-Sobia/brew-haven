<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="icedBrew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C58B55"/>
      <stop offset="40%" stop-color="#6A4235"/>
      <stop offset="100%" stop-color="#29211D"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#FFF8EE"/>
  <!-- Glass Base -->
  <ellipse cx="100" cy="170" rx="32" ry="7" fill="#EADBC8"/>
  <!-- Glass Cup -->
  <path d="M72 45 L78 165 Q100 170 122 165 L128 45 Z" fill="url(#icedBrew)"/>
