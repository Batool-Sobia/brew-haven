  <path d="M108 140 L135 15" stroke="#FFF8EE" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Floating Ice Cubes -->
  <rect x="84" y="60" width="18" height="18" rx="3" fill="#FFF8EE" opacity="0.8" transform="rotate(15 93 69)"/>
  <rect x="98" y="78" width="18" height="18" rx="3" fill="#FFF8EE" opacity="0.8" transform="rotate(-20 107 87)"/>
  <rect x="82" y="102" width="18" height="18" rx="3" fill="#FFF8EE" opacity="0.75" transform="rotate(10 91 111)"/>
  <!-- Condensation droplets -->
  <ellipse cx="75" cy="90" rx="1.5" ry="3" fill="#FFF8EE" opacity="0.8"/>
  <ellipse cx="125" cy="115" rx="1.5" ry="3" fill="#FFF8EE" opacity="0.8"/>
  <ellipse cx="76" cy="130" rx="1.5" ry="2.5" fill="#FFF8EE" opacity="0.8"/>
</svg>
